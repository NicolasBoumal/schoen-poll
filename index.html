<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Schoen Poll - Clicker</title>
    
    <!-- These are just for the favicon. -->
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="manifest" href="site.webmanifest">

    <style>
        body { font-family: system-ui, sans-serif; max-width: 500px; margin: 0 auto; padding: 20px; text-align: center; background: white; transition: background-color 0.2s ease-in-out; }
        
        /* Semantic Status Message Styling */
        #statusMessage { 
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            margin-top: 20px;
            font-size: 0.95rem;
            transition: all 0.2s ease-in-out;
        }
        .status-info { background-color: #e3f2fd; color: #1565c0; border: 1px solid #bbdefb; }
        .status-success { background-color: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }
        .status-warning { background-color: #fff3e0; color: #e65100; border: 1px solid #ffe0b2; }
        .status-error { background-color: #ffebee; color: #c62828; border: 1px solid #ffcdd2; }
        .hidden { display: none !important; }

        .options-container { display: flex; flex-direction: column; gap: 15px; }
        button.option-btn {
            padding: 15px 20px; font-size: 1.2em; cursor: pointer;
            border: 2px solid #4285F4; border-radius: 8px;
            background: white; color: #4285F4; transition: all 0.2s;
            transition: transform 0.1s;
        }
        button.option-btn:active { transform: scale(0.96); }
        button.option-btn:hover { background: #f0f4ff; }
        button.option-btn.selected { background: #4285F4; color: white; }
        button.option-btn:disabled { border-color: #ccc; color: #999; cursor: not-allowed; background: #f9f9f9; }
        button.option-btn.selected:disabled { background: #a0c1ff; border-color: #a0c1ff; color: white; }
    </style>
</head>
<body>

    <h2>Schoen Poll</h2>
    <div id="optionsContainer" class="options-container"></div>
    <div id="statusMessage" class="status-info" role="status">Connecting...</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, setDoc, getDoc, deleteDoc, serverTimestamp, disableNetwork, enableNetwork } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        import { firebaseConfig, colors } from "./config.js";

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const statusMessage = document.getElementById('statusMessage');
        const optionsContainer = document.getElementById('optionsContainer');
        
        let currentUser = null;
        let activeQuestionId = null;
        let currentSelection = null;
        let currentOptions = [];
        let colorClickersEnabled = false;
        let currentStatus = null;
        let pendingVote = null;
        let answerState = null;
        let unsubscribeLiveState = null;
        let reconnectPromise = null;

        const maxClicksPerQuestion = 6; // Feeling facetious?
        let clicksRemaining = maxClicksPerQuestion;

        function showStatus(message, type = 'info', autoHide = false) {
            if (!statusMessage) return;
            
            // Remove old classes
            statusMessage.classList.remove('status-info', 'status-success', 'status-warning', 'status-error', 'hidden');
            
            if (!message) {
                statusMessage.classList.add('hidden');
                return;
            }

            // Apply new classes and HTML
            statusMessage.classList.add(`status-${type}`);
            statusMessage.innerHTML = message;

            if (autoHide) {
                setTimeout(() => {
                    statusMessage.classList.add('hidden');
                    statusMessage.innerHTML = "";
                }, 3000);
            }
        }

        function updateClickerBackground(forceWhite = false) {
            if (forceWhite || !colorClickersEnabled || !currentSelection) {
                document.body.style.backgroundColor = "white";
                return;
            }

            const selectedIndex = currentOptions.indexOf(currentSelection);
            if (selectedIndex === -1) {
                document.body.style.backgroundColor = "white";
                return;
            }

            document.body.style.backgroundColor = colors[selectedIndex % colors.length];
        }

        // 1. Make sure the user is logged in somehow
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // If a user is already logged in, just use that session
                console.log("Session detected: ", user.isAnonymous ? "Anonymous" : "Authenticated");
                currentUser = user;
                startListeningToLiveState();
            } else {
                // No session found? Then sign in anonymously
                console.log("No session found. Signing in anonymously...");
                
                // Enforce maximum persistence of the new anonymous session (it is so by default, but let's be explicit)
                setPersistence(auth, browserLocalPersistence)
                    .then(() => {
                        return signInAnonymously(auth);
                    })
                    .catch((error) => {
                        console.error("Auth Error:", error.code, error.message);
                        if (error.code === 'auth/quota-exceeded' || error.code === 'auth/too-many-requests') {
                            showStatus(`
                                <strong>⚠️ Action needed</strong><br>
                                Too many new users are connecting from the same Wi-Fi.<br><br>
                                <strong>To fix this:</strong>
                                <ol style="text-align: left; margin-bottom: 0; padding-left: 20px;">
                                    <li>Turn <strong>OFF</strong> Wi-Fi.</li>
                                    <li>Refresh page using <strong>Cellular Data</strong>.</li>
                                    <li>Turn Wi-Fi back on.</li>
                                </ol>
                            `, 'warning');
                        } else {
                            showStatus("Connection error. Please try refreshing the page.", "error");
                        }
                    });
            }
        });

        // 2. Listen to the live state
        function startListeningToLiveState() {
            const liveStateRef = doc(db, "state", "live");
            if (unsubscribeLiveState) unsubscribeLiveState();
            
            unsubscribeLiveState = onSnapshot(liveStateRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    handleStateChange(data);
                }
            }, (error) => {
                // Firestore stops delivering updates after a terminal listener error.
                unsubscribeLiveState = null;
                console.error("Live updates failed:", error);
                showStatus("Live updates stopped. Switch away and back to retry.", "error");
            });
        }

        // 3. Update UI based on what the Admin is doing
        function handleStateChange(data) {
            currentOptions = Array.isArray(data.options) ? data.options : [];
            colorClickersEnabled = data.colorClickers === true;
            currentStatus = data.status;
            
            // Check if the question ID from Firebase is different from our local memory
            if (data.active_question_id !== activeQuestionId) {
                // The old write may still finish, but must not update this question's UI.
                if (pendingVote) clearTimeout(pendingVote.statusTimer);
                pendingVote = null;
                answerState = null;
                activeQuestionId = data.active_question_id;
                currentSelection = null;

                const savedId = localStorage.getItem('active_poll_id');
                if (savedId === activeQuestionId) {
                    // Same question as before refresh, load the saved clicks
                    clicksRemaining = parseInt(localStorage.getItem('active_poll_clicks')) || 0;
                } else {
                    // Brand new question or first time seeing this ID
                    clicksRemaining = maxClicksPerQuestion;
                    localStorage.setItem('active_poll_id', activeQuestionId);
                    localStorage.setItem('active_poll_clicks', clicksRemaining);
                }
            }

            optionsContainer.innerHTML = ''; 

            // If the poll is completely finished, clear the options and show waiting text
            if (data.status === "complete") {
                updateStatusUI();
                updateClickerBackground(true);
                return; // Stop executing, which leaves the optionsContainer empty
            }

            currentOptions.forEach(optionText => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = optionText;
                btn.value = optionText;
                
                btn.onclick = () => submitAnswer(optionText);
                optionsContainer.appendChild(btn);
            });

            updateAnswerUI();
            updateStatusUI();

            if (!answerState && activeQuestionId) {
                answerState = {
                    questionId: activeQuestionId,
                    confirmedSelection: null,
                    loadError: null
                };
                answerState.ready = restorePreviousAnswer(answerState);
            }
        }

        function updateAnswerUI() {
            optionsContainer.querySelectorAll('.option-btn').forEach(btn => {
                btn.classList.toggle('selected', btn.value === currentSelection);
                btn.disabled = currentStatus !== "open";
                // Ignore pending taps without flashing the grey disabled-button styling.
                btn.setAttribute('aria-disabled', String(btn.disabled || pendingVote !== null));
            });
            updateClickerBackground(currentStatus === "complete");
        }

        // 4. Send the vote (or delete it)
        async function submitAnswer(selectedOption) {
            if (!currentUser || !activeQuestionId || !answerState || currentStatus !== "open" || pendingVote) return;

            // Block ANY click (selecting or unselecting) if they are out of clicks
            if (clicksRemaining <= 0) {
                showStatus("No more changes allowed for this question.", "error");
                return;
            }

            const state = answerState;
            const vote = {
                questionId: activeQuestionId,
                selection: currentSelection === selectedOption ? null : selectedOption,
                showPendingStatus: false
            };
            pendingVote = vote;
            currentSelection = vote.selection;
            updateAnswerUI();
            updateStatusUI();

            vote.statusTimer = setTimeout(() => {
                if (pendingVote === vote) {
                    vote.showPendingStatus = true;
                    updateStatusUI();
                }
            }, 1000);

            const answerRef = doc(db, "questions", vote.questionId, "answers", currentUser.uid);
            let writeError = null;
            try {
                // Establish the rollback value before a write can replace the stored answer.
                // A failed initial read is retried only when the participant taps again.
                if (state.loadError) {
                    state.loadError = null;
                    state.ready = restorePreviousAnswer(state);
                }
                await state.ready;
                if (pendingVote !== vote) return;
                if (state.loadError) throw state.loadError;

                // A tap still waiting for its initial read has not been sent yet.
                if (currentStatus !== "open") {
                    pendingVote = null;
                    currentSelection = state.confirmedSelection;
                    updateAnswerUI();
                    updateStatusUI();
                    return;
                }

                if (vote.selection === null) {
                    await deleteDoc(answerRef);
                } else {
                    await setDoc(answerRef, { choice: vote.selection, timestamp: serverTimestamp() });
                }
            } catch (error) {
                writeError = error;
                console.error("Error saving answer:", error);
            } finally {
                clearTimeout(vote.statusTimer);
            }

            // Another question may have launched while Firestore was confirming this write.
            if (pendingVote !== vote) return;
            pendingVote = null;

            if (writeError) {
                currentSelection = state.confirmedSelection;
            } else {
                state.confirmedSelection = vote.selection;
                // Only confirmed actions consume a click.
                clicksRemaining--;
                localStorage.setItem('active_poll_clicks', clicksRemaining);
            }

            updateAnswerUI();
            if (writeError && currentStatus === "open") {
                showStatus(state.loadError
                    ? "Your previous answer could not be loaded. Please tap again to retry."
                    : "Your change could not be saved. Please try again.", "error");
            } else {
                updateStatusUI();
            }
        }

        function updateStatusUI() {
            if (currentStatus === "complete") {
                showStatus("Waiting for the next question to launch...", "info");
                return;
            }
            if (currentStatus === "closed") {
                showStatus("This question is closed.", "info");
                return;
            }
            if (pendingVote && pendingVote.showPendingStatus) {
                showStatus(navigator.onLine ? "Sending…" : "Waiting for connection…", "info");
                return;
            }
            if (clicksRemaining === maxClicksPerQuestion) {
                showStatus("Select your answer.", "info");
                return;
            }
            if (clicksRemaining === 0) {
                showStatus("Final answer locked in.", "info");
                return;
            }
            if (clicksRemaining <= 3) {
                const timesText = (clicksRemaining === 1) ? "time" : "times";
                showStatus(`You may change your answer at most ${clicksRemaining} more ${timesText}.`, "info");
                return;
            }
            showStatus("");
        }

        // Connectivity changes only update the message; Firestore handles queued writes.
        ['online', 'offline'].forEach(eventName => {
            window.addEventListener(eventName, () => {
                if (pendingVote && pendingVote.showPendingStatus) updateStatusUI();
            });
        });

        // 5. Check if the user already answered this question
        async function restorePreviousAnswer(state) {
            try {
                const answerRef = doc(db, "questions", state.questionId, "answers", currentUser.uid);
                const docSnap = await getDoc(answerRef);
                state.confirmedSelection = docSnap.exists() ? docSnap.data().choice : null;

                // Keep an early tap highlighted while retaining its confirmed rollback value.
                if (answerState !== state || pendingVote) return;
                currentSelection = state.confirmedSelection;
                updateAnswerUI();
            } catch (error) {
                state.loadError = error;
                console.error("Error fetching previous answer:", error);
            }
        }

        // 6. Recover the live connection after the browser suspends this page.
        function reconnectLiveState() {
            if (!currentUser || document.visibilityState !== 'visible' || !navigator.onLine) return;
            if (reconnectPromise) return reconnectPromise;

            // Reset a potentially stalled connection, keeping queued votes intact.
            // Coalesce visibility, pageshow, and online events into one recovery.
            reconnectPromise = (async () => {
                try {
                    await disableNetwork(db);
                    if (!unsubscribeLiveState) startListeningToLiveState();
                } finally {
                    await enableNetwork(db);
                }
            })().catch((error) => {
                console.error("Error reconnecting live updates:", error);
                showStatus("Could not reconnect. Switch away and back to retry.", "error");
            }).finally(() => {
                reconnectPromise = null;
            });
            return reconnectPromise;
        }

        // Use the live listener as the sole source of poll state: a separate wake-up
        // fetch could return stale data after a newer listener snapshot has arrived.
        document.addEventListener("visibilitychange", reconnectLiveState);
        window.addEventListener("online", reconnectLiveState);
        window.addEventListener("pageshow", (event) => {
            if (event.persisted) reconnectLiveState();
        });
    </script>
</body>
</html>
